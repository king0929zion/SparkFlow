name: SparkFlow Web Chat Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sparkflow-chat-smoke
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SPARKFLOW_SMOKE_TEST: "1"

jobs:
  smoke:
    name: Verify Web Chat without sending
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: user-data

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Export repository variables and secrets
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Ensure browser runtime
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            playwright install chromium --with-deps --only-shell
          fi

      - name: Verify Douyin Web Chat without sending
        run: python main.py

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            run-status.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6
