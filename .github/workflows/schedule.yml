name: DouYin Spark Flow Schedule Run

on:
  workflow_dispatch:
  schedule:
    # 使用北京时间直接配置，避免手工换算 UTC；错开整点以降低 GitHub Actions 调度高峰影响。
    - cron: "7 9 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: sparkflow-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  run-main:
    name: Run SparkFlow
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Export repository variables and secrets
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py

      - name: Validate SparkFlow configuration
        id: config_check
        run: python utils/validate_config.py

      - name: Test Douyin accessibility
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --location --head \
            --connect-timeout 10 --max-time 20 --retry 2 \
            https://creator.douyin.com/ >/dev/null

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Detect Playwright version
        id: playwright
        shell: bash
        run: |
          echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright_cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium system dependencies
        run: playwright install-deps chromium

      - name: Install Chromium headless shell
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: playwright install chromium --only-shell

      - name: Run DouYin Spark Flow
        id: sparkflow
        run: python main.py

      - name: Write Actions summary
        if: always()
        env:
          CONFIG_OUTCOME: ${{ steps.config_check.outcome }}
          SPARKFLOW_OUTCOME: ${{ steps.sparkflow.outcome }}
        run: python utils/github_summary.py

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            run-status.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  workflow-keepalive:
    name: Keep scheduled workflow enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Pin third-party action to the commit behind v1.2.1.
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c
