name: DouYin Spark Flow Schedule Run

on:
  workflow_dispatch:
  schedule:
    - cron: "7 9 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: sparkflow-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  run-main:
    name: Run SparkFlow
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-jammy
    environment: user-data

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show pinned runtime
        shell: bash
        run: |
          python --version
          echo "Container: mcr.microsoft.com/playwright/python:v1.61.0-jammy"

      - name: Export repository variables and secrets
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py

      - name: Validate SparkFlow configuration
        id: config_check
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          def fail(message):
              print(f"Configuration error: {message}", file=sys.stderr)
              raise SystemExit(2)

          try:
              tasks = json.loads(os.getenv("TASKS", "[]"))
          except json.JSONDecodeError as exc:
              fail(f"TASKS is not valid JSON: {exc}")

          if not isinstance(tasks, list) or not tasks:
              fail("TASKS must be a non-empty JSON array")

          match_mode = os.getenv("MATCH_MODE", "nickname")
          if match_mode not in {"nickname", "short_id"}:
              fail("MATCH_MODE must be nickname or short_id")

          for index, task in enumerate(tasks, start=1):
              if not isinstance(task, dict):
                  fail(f"TASKS[{index}] must be an object")
              unique_id = str(task.get("unique_id") or "").strip()
              targets = task.get("targets")
              if not unique_id:
                  fail(f"TASKS[{index}] is missing unique_id")
              if not isinstance(targets, list) or not targets:
                  fail(f"TASKS[{index}].targets must be a non-empty array")
              cookies_key = f"COOKIES_{unique_id}".upper()
              if not os.getenv(cookies_key):
                  fail(f"missing secret/environment variable: {cookies_key}")

          for name, default in {
              "BROWSER_TIMEOUT": "120000",
              "FRIEND_LIST_WAIT_TIME": "2000",
              "TASK_RETRY_TIMES": "3",
          }.items():
              raw = os.getenv(name, default)
              try:
                  value = int(raw)
              except ValueError:
                  fail(f"{name} must be an integer")
              if value <= 0:
                  fail(f"{name} must be greater than 0")

          print(f"Configuration validation passed for {len(tasks)} account task(s).")
          PY

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Playwright runtime
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          from pathlib import Path

          version = importlib.metadata.version("playwright")
          print(f"Playwright Python: {version}")
          print(f"Bundled browsers directory exists: {Path('/ms-playwright').exists()}")
          if version != "1.61.0":
              raise SystemExit(f"Unexpected Playwright version: {version}")
          PY

      - name: Test Douyin accessibility
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request

          request = urllib.request.Request(
              "https://www.douyin.com/",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              print(f"Douyin HTTP: {response.status}")
          PY

      - name: Preflight Web Chat smoke test
        id: smoke
        env:
          SPARKFLOW_SMOKE_TEST: "1"
        run: python main.py

      - name: Run DouYin Spark Flow
        id: sparkflow
        env:
          SPARKFLOW_SMOKE_TEST: "0"
        run: python main.py

      - name: Write Actions summary
        if: always()
        shell: bash
        env:
          CONFIG_OUTCOME: ${{ steps.config_check.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SPARKFLOW_OUTCOME: ${{ steps.sparkflow.outcome }}
        run: |
          {
            echo "## SparkFlow run summary"
            echo
            echo "- Runtime: Playwright Python 1.61.0 / Jammy container"
            echo "- Configuration: ${CONFIG_OUTCOME:-not-run}"
            echo "- Safe Web Chat smoke: ${SMOKE_OUTCOME:-not-run}"
            echo "- Message task: ${SPARKFLOW_OUTCOME:-not-run}"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Ref: ${GITHUB_REF_NAME}"
            echo "- Run: ${GITHUB_RUN_ID} / attempt ${GITHUB_RUN_ATTEMPT}"
            if [ -f run-status.json ]; then
              echo "- Structured status: run-status.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            run-status.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  workflow-keepalive:
    name: Keep scheduled workflow enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c
