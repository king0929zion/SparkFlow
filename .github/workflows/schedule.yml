name: SparkFlow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: send
        type: choice
        options:
          - send
          - smoke
  schedule:
    - cron: "7 9 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: sparkflow-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  run:
    name: Run SparkFlow on main
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-jammy
    environment: user-data

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Show pinned runtime
        shell: bash
        run: |
          python --version
          echo "Container: mcr.microsoft.com/playwright/python:v1.61.0-jammy"

      - name: Export repository variables and secrets
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py

      - name: Validate SparkFlow configuration
        id: config
        run: python -m utils.validate_config

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Playwright runtime
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          from pathlib import Path

          version = importlib.metadata.version("playwright")
          print(f"Playwright Python: {version}")
          print(f"Bundled browsers directory exists: {Path('/ms-playwright').exists()}")
          if version != "1.61.0":
              raise SystemExit(f"Unexpected Playwright version: {version}")
          PY

      - name: Test Douyin Web Chat accessibility
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request

          request = urllib.request.Request(
              "https://www.douyin.com/chat",
              headers={"User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              print(f"Douyin Web Chat HTTP: {response.status}")
          PY

      - name: Preflight Web Chat smoke test
        id: smoke_preflight
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        run: python main.py --mode smoke

      - name: Send SparkFlow messages
        id: send
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        run: python main.py --mode send

      - name: Smoke only
        id: smoke_only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke'
        run: python main.py --mode smoke

      - name: Write Actions summary
        if: always()
        shell: bash
        env:
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.smoke_preflight.outcome }}
          SEND_OUTCOME: ${{ steps.send.outcome }}
          SMOKE_ONLY_OUTCOME: ${{ steps.smoke_only.outcome }}
          REQUESTED_MODE: ${{ inputs.mode || 'send' }}
        run: |
          {
            echo "## SparkFlow run summary"
            echo
            echo "- Branch: main"
            echo "- Requested mode: ${REQUESTED_MODE}"
            echo "- Runtime: Playwright Python 1.61.0 / Jammy container"
            echo "- Configuration: ${CONFIG_OUTCOME:-not-run}"
            echo "- Preflight smoke: ${PREFLIGHT_OUTCOME:-not-run}"
            echo "- Send: ${SEND_OUTCOME:-not-run}"
            echo "- Smoke-only: ${SMOKE_ONLY_OUTCOME:-not-run}"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Run: ${GITHUB_RUN_ID} / attempt ${GITHUB_RUN_ATTEMPT}"
            if [ -f run-status.json ]; then
              echo "- Structured status: run-status.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sparkflow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            run-status.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  workflow-keepalive:
    name: Keep scheduled workflow enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c
