name: DouYin Spark Flow Schedule Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "utils/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/schedule.yml"
  schedule:
    - cron: "7 9 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: sparkflow-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  run-main:
    name: Run SparkFlow
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    env:
      # Push 只做真实环境 smoke test，不点击聊天、不输入、不发送消息。
      SPARKFLOW_SMOKE_TEST: ${{ github.event_name == 'push' && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Export repository variables and secrets
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py

      - name: Validate SparkFlow configuration
        id: config_check
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          def fail(message):
              print(f"Configuration error: {message}", file=sys.stderr)
              raise SystemExit(2)

          try:
              tasks = json.loads(os.getenv("TASKS", "[]"))
          except json.JSONDecodeError as exc:
              fail(f"TASKS is not valid JSON: {exc}")

          if not isinstance(tasks, list) or not tasks:
              fail("TASKS must be a non-empty JSON array")

          match_mode = os.getenv("MATCH_MODE", "nickname")
          if match_mode not in {"nickname", "short_id"}:
              fail("MATCH_MODE must be nickname or short_id")

          for index, task in enumerate(tasks, start=1):
              if not isinstance(task, dict):
                  fail(f"TASKS[{index}] must be an object")
              unique_id = str(task.get("unique_id") or "").strip()
              targets = task.get("targets")
              if not unique_id:
                  fail(f"TASKS[{index}] is missing unique_id")
              if not isinstance(targets, list) or not targets:
                  fail(f"TASKS[{index}].targets must be a non-empty array")
              cookies_key = f"COOKIES_{unique_id}".upper()
              if not os.getenv(cookies_key):
                  fail(f"missing secret/environment variable: {cookies_key}")

          for name, default in {
              "BROWSER_TIMEOUT": "120000",
              "FRIEND_LIST_WAIT_TIME": "2000",
              "TASK_RETRY_TIMES": "3",
          }.items():
              raw = os.getenv(name, default)
              try:
                  value = int(raw)
              except ValueError:
                  fail(f"{name} must be an integer")
              if value <= 0:
                  fail(f"{name} must be greater than 0")

          print(f"Configuration validation passed for {len(tasks)} account task(s).")
          print(f"Run mode: {'smoke' if os.getenv('SPARKFLOW_SMOKE_TEST') == '1' else 'send'}")
          PY

      - name: Test Douyin accessibility
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --location --output /dev/null \
            --connect-timeout 10 --max-time 20 --retry 2 \
            https://www.douyin.com/

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Ensure browser runtime
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            playwright install chromium --with-deps --only-shell
          fi

      - name: Run DouYin Spark Flow
        id: sparkflow
        run: python main.py

      - name: Write Actions summary
        if: always()
        shell: bash
        env:
          CONFIG_OUTCOME: ${{ steps.config_check.outcome }}
          SPARKFLOW_OUTCOME: ${{ steps.sparkflow.outcome }}
        run: |
          {
            echo "## SparkFlow run summary"
            echo
            echo "- Configuration: ${CONFIG_OUTCOME:-not-run}"
            echo "- SparkFlow: ${SPARKFLOW_OUTCOME:-not-run}"
            echo "- Mode: $([ "$SPARKFLOW_SMOKE_TEST" = "1" ] && echo smoke || echo send)"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Ref: ${GITHUB_REF_NAME}"
            echo "- Run: ${GITHUB_RUN_ID} / attempt ${GITHUB_RUN_ATTEMPT}"
            if [ -f run-status.json ]; then
              echo "- Structured status: run-status.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            run-status.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  workflow-keepalive:
    name: Keep scheduled workflow enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c
