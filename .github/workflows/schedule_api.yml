# 此工作流用于运行 api（测试）分支的定时任务，如果不清楚请使用主工作流。

name: 【api（测试）分支】DouYin Spark Flow Schedule Run

on:
  workflow_dispatch:
  schedule:
    - cron: "27 9 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: sparkflow-api
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data

    steps:
      - name: Checkout api branch
        uses: actions/checkout@v6
        with:
          ref: api

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Test Douyin accessibility
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --location --head \
            --connect-timeout 10 --max-time 20 --retry 2 \
            https://www.douyin.com/ >/dev/null

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Export repository variables and secrets
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py

      - name: Run DouYin Spark Flow
        run: python main.py

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-run-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c
