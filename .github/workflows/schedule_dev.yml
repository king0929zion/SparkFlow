# 此工作流用于运行 dev（测试）分支的定时任务，如果不清楚请使用主工作流。

name: 【dev（测试）分支】DouYin Spark Flow Schedule Run

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: sparkflow-dev
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Test Douyin accessibility
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --location --head \
            --connect-timeout 10 --max-time 20 --retry 2 \
            https://www.douyin.com/ >/dev/null

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Detect Playwright version
        id: playwright
        shell: bash
        run: |
          echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright_cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium system dependencies
        run: playwright install-deps chromium

      - name: Install Chromium headless shell
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: playwright install chromium --only-shell

      - name: Export repository variables and secrets
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py

      - name: Run DouYin Spark Flow
        run: python main.py

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-run-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c
